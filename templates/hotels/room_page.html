{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Location Information</title>
    <link rel="stylesheet" href="{% static 'css/location_page.css' %}">
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAP_API_KEY"></script>
</head>
<body>

<div class="container">
    <h2>Room Setup</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save Room</button>
    </form>

    <hr>

    <h3>Added Rooms</h3>

    {% for room in rooms %}
        <div>
            <strong>{{ room.room_name }}</strong> -
            {{ room.get_room_type_display }} -
            ₹{{ room.base_rate }}
        </div>
    {% empty %}
        <p>No rooms added yet.</p>
    {% endfor %}
</div>

<script>
    const extraBedRadio = document.querySelectorAll('input[name="extra_bed_allowed"]');
    const extraBedField = document.querySelector('#id_extra_bed_type').parentElement;

    function toggleExtraBed() {
        if (document.querySelector('input[name="extra_bed_allowed"]:checked').value === "True") {
            extraBedField.style.display = "block";
        } else {
            extraBedField.style.display = "none";
        }
    }

    extraBedRadio.forEach(r => r.addEventListener("change", toggleExtraBed));
    toggleExtraBed();
</script>

</body>
</html>
