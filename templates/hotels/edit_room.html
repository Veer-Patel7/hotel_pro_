{% extends "hotels/hotel_base.html" %}
{% block content %}

<div class="container-fluid">

    <div class="row mb-3">
        <div class="col-sm-6">
            <h3>Edit Room</h3>
        </div>
    </div>

    <div class="card card-warning">
        <div class="card-header">
            <h5 class="card-title">Update Room Details</h5>
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <div class="col-md-4">
                        <label>Room Category</label>
                        {{ form.category }}
                    </div>

                    <div class="col-md-4">
                        <label>Room Number</label>
                        {{ form.room_number }}
                    </div>

                    <div class="col-md-4">
                        <label>Status</label>
                        {{ form.status }}
                    </div>

                </div>

                <button type="submit" class="btn btn-success mt-3">
                    <i class="fas fa-save"></i> Update Room
                </button>

                <a href="{% url 'hotels:manage_rooms' %}" class="btn btn-secondary mt-3">
                    Cancel
                </a>

            </form>
        </div>
    </div>

</div>

{% endblock %}
